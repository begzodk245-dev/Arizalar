<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arizalar">
<meta name="theme-color" content="#1f5fbf">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>Arizalar reestri</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dfe3ea;--pr:#1f5fbf;--ok:#e3f5e8;--wa:#fff4d6;--re:#fde4e4;--ok2:#1b7f3b;--er:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#323946;--pr:#6ea3ff;--ok:#17331f;--wa:#3a3117;--re:#3d1b1b;--ok2:#5fd283;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin:0}
small,.mt{color:var(--mut);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#msg{font-size:13px;color:var(--mut);min-height:18px}#msg.err{color:var(--er)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.st b{display:block;font-size:20px}.st span{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
button{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;touch-action:manipulation}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar>input,.bar>select{flex:1 1 140px;width:auto}
.sc{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sc img{max-width:100px;max-height:100px;border-radius:8px;border:1px solid var(--bd);display:none}
#scanmsg{flex:1 1 220px;font-size:13px}#scanmsg.warn{color:#b26a00}
.chk{border-color:#e0a800!important;background:var(--wa)!important}
.it{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.it.s0{background:var(--re)}.it.s1{background:var(--wa)}.it.s2{background:var(--ok)}
.top{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.late{color:var(--er);font-weight:600;font-size:12px}
.tg{display:block;width:100%;text-align:left;margin-top:8px;line-height:1.3;min-height:46px}
.tg.on{border-color:var(--ok2);font-weight:600}
.x{margin-top:8px;padding:6px 12px;font-size:13px}.x.arm{background:var(--er);color:#fff;border-color:var(--er)}
.bno{margin-top:8px}
.pic{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:8px;margin-top:8px;border:1px solid var(--bd);background:var(--bg)}
#login{max-width:360px;margin:12vh auto}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card" hidden>
 <h1>Arizalar reestri</h1><p class="mt">Kirish uchun email va parolni kiriting.</p>
 <label>Email</label><input id="em" type="email" autocomplete="username">
 <label style="margin-top:8px">Parol</label><input id="pw" type="password" autocomplete="current-password">
 <div class="row"><button class="p" id="li">Kirish</button></div>
 <div id="lerr" class="mt" style="color:var(--er);margin-top:8px"></div>
</div>

<div id="app" hidden>
<div class="head"><h1>Arizalar reestri</h1><button id="lo">Chiqish</button></div>
<div id="msg"></div>
<div class="stats" id="stats"></div>

<div class="card"><div class="sc">
 <button class="p" id="scanbtn">📷 Kamera bilan skanerlash</button>
 <button id="galbtn">🖼 Galereyadan</button>
 <input type="file" id="cam" accept="image/*" capture="environment" hidden>
 <input type="file" id="img" accept="image/*" hidden>
 <input type="file" id="attf" accept="image/*" hidden>
 <img id="prev" alt="Ariza rasmi">
 <div id="scanmsg"><small>Ariza rasmini yuboring: Claude o‘qiydi va maydonlarni to‘ldiradi. Tekshirib, kerak bo‘lsa tuzating va “Qo‘shish” ni bosing.</small></div>
</div></div>

<div class="card"><div class="grid">
 <div><label>FISH</label><input id="fish" placeholder="Familiya Ism Sharif"></div>
 <div><label>Sana</label><input id="sana" type="date"></div>
 <div><label>Guruh / yo‘nalish</label><input id="guruh" placeholder="Masalan: EA-21"></div>
 <div><label>Ariza turi</label><select id="tur"></select></div>
 <div><label>Imzo qo‘yganlar</label><input id="imzo" placeholder="Dekan, Prorektor..."></div>
</div><div class="row"><button class="p" id="add">Qo‘shish</button></div></div>

<div class="bar">
 <input id="q" placeholder="Qidiruv: FISH, guruh, buyruq raqami"><select id="ft"></select>
 <select id="fs"><option value="">Barcha holat</option><option value="0">Kutilmoqda</option><option value="1">Buyruq tayyorlanmoqda</option><option value="2">Buyruq chiqdi</option><option value="late">Kechikkan</option></select>
 <button id="csv">Excel (CSV)</button>
</div>
<div id="list"></div>
<div id="empty" class="mt" style="display:none;padding:10px">Hozircha ariza yo‘q.</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>("0"+n).slice(-2);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const days=s=>{const a=String(s).split("-");return Math.floor((new Date()-new Date(+a[0],+a[1]-1,+a[2]))/864e5)};
const st=r=>r.b2?2:(r.b1?1:0), late=r=>!r.b2&&days(r.sana)>CFG.lateDays;
let D=[],armed="",lastTap=0,pend=null,attId="",shown={},urls={};
function msg(t,e){const m=$("msg");m.textContent=t;m.className=e?"err":""}
const opts=()=>{const o=CFG.types.map(t=>"<option>"+esc(t)+"</option>").join("");$("tur").innerHTML=o;$("ft").innerHTML='<option value="">Barcha turlar</option>'+o};

async function load(){
 const {data,error}=await sb.from("applications").select("*").order("created_at",{ascending:true});
 if(error){msg("Yuklashda xato: "+error.message,1);return}
 D=data;render();msg("☁ Ulangan")}
async function upd(id,patch){
 const {error}=await sb.from("applications").update(patch).eq("id",id);
 if(error){msg("Saqlanmadi: "+error.message,1);return false}
 const r=D.find(x=>x.id===id);Object.assign(r,patch);render();msg("Saqlandi ✓");return true}

function render(){
 const q=$("q").value.toLowerCase(),ft=$("ft").value,fs=$("fs").value;
 const rows=D.map((r,i)=>({r,n:i+1})).filter(({r})=>{
  if(ft&&r.tur!==ft)return false;
  if(fs==="late"){if(!late(r))return false}else if(fs!==""&&String(st(r))!==fs)return false;
  return !q||(r.fish+" "+(r.guruh||"")+" "+(r.bno||"")).toLowerCase().includes(q)})
  .sort((a,b)=>a.r.sana<b.r.sana?1:a.r.sana>b.r.sana?-1:b.n-a.n);
 $("list").innerHTML=rows.map(({r,n})=>{const id=esc(r.id);
  return `<div class="it s${st(r)}"><div class="top"><b>${esc(r.fish)}</b><span class="mt">№${n}</span></div>
  <div class="mt">${esc(r.sana)}${late(r)?` <span class="late">${days(r.sana)} kun kechikdi</span>`:""} · ${esc(r.tur)}${r.guruh?" · "+esc(r.guruh):""}</div>
  ${r.imzo?`<div class="mt">Imzo: ${esc(r.imzo)}</div>`:""}
  <button type="button" class="tg${r.b1?" on":""}" data-a="b1" data-id="${id}">${r.b1?"✅":"⬜"} 1. Rezolyutsiya bilan tushdi, buyruqqa berildi${r.b1?" ("+esc(r.b1)+")":""}</button>
  <button type="button" class="tg${r.b2?" on":""}" data-a="b2" data-id="${id}">${r.b2?"✅":"⬜"} 2. Buyruq chiqdi${r.b2?" ("+esc(r.b2)+")":""}</button>
  ${r.b2?`<input class="bno" data-id="${id}" value="${esc(r.bno||"")}" placeholder="Buyruq raqami">`:""}
  ${r.img_path?`<button type="button" class="tg" data-a="pic" data-id="${id}">🖼 ${shown[r.id]?"Rasmni yashirish":"Ariza rasmini ko‘rsatish"}</button>${shown[r.id]&&urls[r.id]?`<img class="pic" src="${esc(urls[r.id])}" alt="Ariza rasmi">`:""}`
   :`<button type="button" class="tg" data-a="att" data-id="${id}">📎 Ariza rasmini biriktirish</button>`}
  <button type="button" class="x${armed===r.id?" arm":""}" data-a="del" data-id="${id}">${armed===r.id?"Aniq o‘chirilsinmi? Yana bosing":"O‘chirish"}</button></div>`}).join("");
 $("empty").style.display=rows.length?"none":"block";
 const c=[0,0,0];let l=0;D.forEach(r=>{c[st(r)]++;if(late(r))l++});
 $("stats").innerHTML=[["Jami",D.length],["Kutilmoqda",c[0]],["Buyruq tayyorlanmoqda",c[1]],["Buyruq chiqdi",c[2]],["Kechikkan",l]].map(x=>`<div class="st"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}

$("list").addEventListener("click",async e=>{
 const t=e.target.closest("button");if(!t||!t.dataset.a)return;
 const now=Date.now();if(now-lastTap<500)return;lastTap=now;
 const r=D.find(x=>x.id===t.dataset.id);if(!r)return;const a=t.dataset.a;
 if(a==="b1")await upd(r.id,r.b1?{b1:null,b2:null}:{b1:today()});
 else if(a==="b2")await upd(r.id,r.b2?{b2:null}:{b2:today(),b1:r.b1||today()});
 else if(a==="pic"){shown[r.id]=!shown[r.id];if(shown[r.id]&&!urls[r.id]){const {data}=await sb.storage.from("scans").createSignedUrl(r.img_path,3600);urls[r.id]=data&&data.signedUrl}render()}
 else if(a==="att"){attId=r.id;$("attf").click()}
 else if(a==="del"){
  if(armed===r.id){armed="";const {error}=await sb.from("applications").delete().eq("id",r.id);
   if(error){msg("O‘chirilmadi: "+error.message,1);return}
   if(r.img_path)sb.storage.from("scans").remove([r.img_path]);D=D.filter(x=>x.id!==r.id);render();msg("O‘chirildi")}
  else{armed=r.id;render();setTimeout(()=>{if(armed===r.id){armed="";render()}},3500)}}});
$("list").addEventListener("change",e=>{if(e.target.classList.contains("bno"))upd(e.target.dataset.id,{bno:e.target.value})});
["q","ft","fs"].forEach(i=>$(i).addEventListener("input",render));

function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};im.onerror=rej;im.src=URL.createObjectURL(f)})}
async function putImg(blob){const {data:{user}}=await sb.auth.getUser();const path=user.id+"/"+crypto.randomUUID()+".jpg";
 const {error}=await sb.storage.from("scans").upload(path,blob,{contentType:"image/jpeg"});if(error)throw error;return path}
const toB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});

$("add").addEventListener("click",async()=>{
 const f=$("fish").value.trim();if(!f){$("fish").focus();return}
 $("add").disabled=true;
 try{
  let img_path=null;if(pend){msg("Rasm yuklanmoqda...");img_path=await putImg(pend)}
  const rec={fish:f,sana:$("sana").value||today(),guruh:$("guruh").value.trim(),tur:$("tur").value,imzo:$("imzo").value.trim(),img_path};
  const {data,error}=await sb.from("applications").insert(rec).select().single();if(error)throw error;
  D.push(data);pend=null;["fish","guruh","imzo"].forEach(i=>{$(i).value="";$(i).classList.remove("chk")});$("sana").value=today();$("prev").style.display="none";render();msg("Qo‘shildi ✓")
 }catch(e){msg("Qo‘shilmadi: "+(e.message||e),1)}
 $("add").disabled=false});
$("attf").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";const r=D.find(x=>x.id===attId);if(!f||!r)return;
 try{msg("Rasm yuklanmoqda...");const p=await putImg(await shrink(f));delete urls[r.id];shown[r.id]=true;
  const {data}=await sb.storage.from("scans").createSignedUrl(p,3600);urls[r.id]=data&&data.signedUrl;await upd(r.id,{img_path:p})}
 catch(x){msg("Rasm saqlanmadi: "+(x.message||x),1)}});

const mark=(id,bad)=>$(id).classList.toggle("chk",!!bad);
const smsg=(t,w)=>{const m=$("scanmsg");m.className=w?"warn":"";m.textContent=t};
async function scan(f){
 const p=$("prev");p.src=URL.createObjectURL(f);p.style.display="block";
 $("scanbtn").disabled=$("galbtn").disabled=true;smsg("Skanerlanmoqda...");
 try{
  const b=await shrink(f);pend=b;const {data:{session}}=await sb.auth.getSession();
  const res=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({image:await toB64(b),types:CFG.types})});
  const r=await res.json();if(!res.ok)throw new Error(r.error||"xato");
  $("fish").value=r.fish||"";$("guruh").value=r.guruh||"";$("imzo").value=r.imzo||"";if(r.sana)$("sana").value=r.sana;
  $("tur").value=CFG.types.includes(r.tur)?r.tur:"Boshqa";
  mark("fish",!r.fish);mark("sana",!r.sana);mark("guruh",!r.guruh);mark("imzo",!r.imzo);
  smsg(r.shubha?"Tekshiring: "+r.shubha:"O‘qildi. Maydonlarni tekshirib, kerak bo‘lsa tuzating va “Qo‘shish” ni bosing.",!!r.shubha);
 }catch(e){smsg("Skanerlashda xato: "+e.message+". Qayta urinib ko‘ring yoki qo‘lda kiriting.",1)}
 $("scanbtn").disabled=$("galbtn").disabled=false}
$("scanbtn").onclick=()=>$("cam").click();$("galbtn").onclick=()=>$("img").click();
["cam","img"].forEach(i=>$(i).addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)scan(f)}));
["fish","sana","guruh","imzo"].forEach(i=>$(i).addEventListener("input",()=>mark(i,false)));

$("csv").onclick=()=>{
 const h=["№","Sana","FISH","Guruh","Tur","Imzo","1-bosqich sanasi","2-bosqich sanasi","Buyruq №"];
 const r=D.map((x,i)=>[i+1,x.sana,x.fish,x.guruh,x.tur,x.imzo,x.b1,x.b2,x.bno].map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";"));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[h.join(";")].concat(r).join("\n")],{type:"text/csv"}));a.download="arizalar_"+today()+".csv";a.click()};

async function show(){const {data:{session}}=await sb.auth.getSession();
 $("login").hidden=!!session;$("app").hidden=!session;
 if(session){opts();$("sana").value=today();load()}}
$("li").onclick=async()=>{$("lerr").textContent="";
 const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error)$("lerr").textContent="Kirib bo‘lmadi: "+error.message;else show()};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("li").click()});
$("lo").onclick=async()=>{await sb.auth.signOut();D=[];show()};
show();
</script>
</body>
</html>
